name: Release v1.0.1 macOS pre-release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION: 1.0.1
  APP_BUILD_NUMBER: 45

jobs:
  release-check:
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.release_check.outputs.exists }}

    steps:
      - name: Check whether v1.0.1 already exists
        id: release_check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  build-macos:
    needs: release-check
    if: needs.release-check.outputs.exists != 'true'
    runs-on: macos-26

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Test macOS traffic-rate sampling
        working-directory: src/macos/NetworkSpeedLogger
        run: swift test

      - name: Build Universal macOS application and DMG
        run: bash src/macos/NetworkSpeedLogger/Scripts/build-release.sh "$APP_VERSION" "$APP_BUILD_NUMBER"

      - name: Verify macOS artifact and icon
        run: |
          lipo dist/NetworkSpeedLogger.app/Contents/MacOS/NetworkSpeedLogger -verify_arch arm64 x86_64
          actual_version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' dist/NetworkSpeedLogger.app/Contents/Info.plist)
          actual_build=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' dist/NetworkSpeedLogger.app/Contents/Info.plist)
          if [[ "$actual_version" != "$APP_VERSION" ]]; then
            echo "Unexpected application version: $actual_version" >&2
            exit 1
          fi
          if [[ "$actual_build" != "$APP_BUILD_NUMBER" ]]; then
            echo "Unexpected application build number: $actual_build" >&2
            exit 1
          fi
          icon_path=dist/NetworkSpeedLogger.app/Contents/Resources/AppIcon.icns
          if [[ ! -s "$icon_path" ]]; then
            echo "The application icon is missing or empty." >&2
            exit 1
          fi
          iconutil -c iconset "$icon_path" -o dist/VerifiedAppIcon.iconset
          if [[ ! -s dist/VerifiedAppIcon.iconset/icon_512x512@2x.png ]]; then
            echo "The 1024-pixel icon representation could not be decoded." >&2
            exit 1
          fi
          if [[ ! -s dist/NetworkSpeedLogger.dmg ]]; then
            echo "The DMG is missing or empty." >&2
            exit 1
          fi

      - name: Smoke-test macOS application startup
        run: |
          if grep -En 'NSHostingController\(rootView:|private func createMainWindow' \
            src/macos/NetworkSpeedLogger/Sources/NetworkSpeedLogger/StatusBarController.swift; then
            echo "The status-item restore path must not construct a parallel AppKit window." >&2
            exit 1
          fi
          grep -En 'WindowGroup\(id: MainWindowScene.identifier\)' \
            src/macos/NetworkSpeedLogger/Sources/NetworkSpeedLogger/NetworkSpeedLoggerApp.swift

          app_path="dist/NetworkSpeedLogger.app"
          executable="dist/NetworkSpeedLogger.app/Contents/MacOS/NetworkSpeedLogger"
          log_path="$RUNNER_TEMP/network-speed-logger-startup.log"
          defaults write com.hoshinoshion.network-speed-logger showsNetworkSpeedInMenuBar -bool true
          defaults write com.hoshinoshion.network-speed-logger menuBarSpeedSampleInterval -int 1
          defaults write com.hoshinoshion.network-speed-logger menuBarSpeedUnit -string byte
          defaults write com.hoshinoshion.network-speed-logger menuBarSpeedActivityThreshold -int 50
          "$executable" >"$log_path" 2>&1 &
          app_pid=$!

          cleanup() {
            if kill -0 "$app_pid" >/dev/null 2>&1; then
              kill -TERM "$app_pid" >/dev/null 2>&1 || true
            fi
            wait "$app_pid" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for _ in {1..5}; do
            sleep 1
            if ! kill -0 "$app_pid" >/dev/null 2>&1; then
              set +e
              wait "$app_pid"
              exit_code=$?
              set -e
              cat "$log_path"
              echo "The macOS application exited during the startup smoke test with code $exit_code." >&2
              exit 1
            fi
          done

          /usr/bin/open "$app_path"
          for _ in {1..3}; do
            sleep 1
            if ! kill -0 "$app_pid" >/dev/null 2>&1; then
              set +e
              wait "$app_pid"
              exit_code=$?
              set -e
              cat "$log_path"
              echo "The macOS application exited after a system reopen request with code $exit_code." >&2
              exit 1
            fi
          done

          cleanup
          trap - EXIT

          restore_result_path="$RUNNER_TEMP/network-speed-logger-login-item-restore-result.txt"
          rm -f "$restore_result_path"

          NETWORK_SPEED_LOGGER_LOGIN_ITEM_TEST=1 \
          NETWORK_SPEED_LOGGER_LOGIN_ITEM_RESTORE_TEST=1 \
          NETWORK_SPEED_LOGGER_LOGIN_ITEM_RESTORE_TEST_RESULT="$restore_result_path" \
            "$executable" >"$log_path" 2>&1 &
          app_pid=$!
          trap cleanup EXIT

          for _ in {1..15}; do
            if [[ -s "$restore_result_path" ]] && \
              grep -Fxq 'mainWindowCreated=true' "$restore_result_path" && \
              grep -Fxq 'nativeWindowCommandInvoked=true' "$restore_result_path" && \
              grep -Fxq 'mainWindowVisible=true' "$restore_result_path" && \
              grep -Fxq 'activationPolicyRegular=true' "$restore_result_path"; then
              break
            fi
            if ! kill -0 "$app_pid" >/dev/null 2>&1; then
              cat "$log_path"
              echo "The macOS application exited while restoring the login-item window." >&2
              exit 1
            fi
            sleep 1
          done

          if [[ ! -s "$restore_result_path" ]]; then
            cat "$log_path"
            echo "The login-item main window was not restored." >&2
            exit 1
          fi
          cat "$restore_result_path"
          grep -Fx 'mainWindowCreated=true' "$restore_result_path"
          grep -Fx 'nativeWindowCommandInvoked=true' "$restore_result_path"
          grep -Fx 'mainWindowVisible=true' "$restore_result_path"
          grep -Fx 'activationPolicyRegular=true' "$restore_result_path"

          cleanup
          trap - EXIT

      - name: Smoke-test macOS login-item presentation
        run: |
          executable="dist/NetworkSpeedLogger.app/Contents/MacOS/NetworkSpeedLogger"
          log_path="$RUNNER_TEMP/network-speed-logger-login-item.log"
          result_path="$RUNNER_TEMP/network-speed-logger-login-item-result.txt"
          defaults write com.hoshinoshion.network-speed-logger keepsRunningInMenuBar -bool true
          defaults write com.hoshinoshion.network-speed-logger showsNetworkSpeedInMenuBar -bool false
          rm -f "$result_path"

          NETWORK_SPEED_LOGGER_LOGIN_ITEM_TEST=1 \
          NETWORK_SPEED_LOGGER_LOGIN_ITEM_TEST_RESULT="$result_path" \
            "$executable" >"$log_path" 2>&1 &
          app_pid=$!

          cleanup() {
            if kill -0 "$app_pid" >/dev/null 2>&1; then
              kill -TERM "$app_pid" >/dev/null 2>&1 || true
            fi
            wait "$app_pid" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for _ in {1..15}; do
            if [[ -s "$result_path" ]] && grep -q '^visibleWindowCount=' "$result_path"; then
              break
            fi
            if ! kill -0 "$app_pid" >/dev/null 2>&1; then
              cat "$log_path"
              echo "The macOS application exited during the login-item smoke test." >&2
              exit 1
            fi
            sleep 1
          done

          if [[ ! -s "$result_path" ]] || ! grep -q '^visibleWindowCount=' "$result_path"; then
            cat "$log_path"
            if [[ -s "$result_path" ]]; then
              cat "$result_path"
            fi
            echo "The login-item presentation did not become ready." >&2
            exit 1
          fi
          cat "$result_path"
          grep -Fx 'statusItemInstalled=true' "$result_path"
          grep -Fx 'activationPolicyAccessory=true' "$result_path"
          grep -Fx 'visibleWindowCount=0' "$result_path"

          cleanup
          trap - EXIT

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: dist/NetworkSpeedLogger.dmg
          if-no-files-found: error

  publish:
    needs: [release-check, build-macos]
    if: >-
      github.ref == 'refs/heads/main' &&
      needs.release-check.outputs.exists != 'true' &&
      needs.build-macos.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-release
          path: artifacts

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(cat <<'EOF'
          Network Speed Logger 1.0.1 macOS preview

          - Automatic update checks now run after login and continue while the app stays in the menu bar, even when no main window is open.
          - A discovered update can be opened from the menu bar context menu.
          - Manual checks wait longer for GitHub and retry temporary connection and server failures.
          - Includes a Universal macOS DMG for Apple silicon and Intel. Windows remains at v1.0.0.

          This is a pre-release for validation. The automatic checker follows GitHub's latest stable release, so preview releases are available from the release page rather than the in-app update prompt.

          The macOS application is ad-hoc signed but not notarized; first launch may require Open Anyway in System Settings > Privacy & Security.
          EOF
          )
          gh release create v1.0.1 \
            artifacts/NetworkSpeedLogger.dmg \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "v1.0.1 macOS preview" \
            --prerelease \
            --notes "$notes"

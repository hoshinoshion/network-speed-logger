name: Pre-release v0.2.7

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-check:
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.release_check.outputs.exists }}

    steps:
      - name: Check whether v0.2.7 already exists
        id: release_check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.2.7 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  build-macos:
    needs: release-check
    if: needs.release-check.outputs.exists != 'true'
    runs-on: macos-26

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build Universal macOS application and DMG
        run: bash src/macos/NetworkSpeedLogger/Scripts/build-release.sh 0.2.7

      - name: Verify Universal architectures
        run: lipo -info dist/NetworkSpeedLogger.app/Contents/MacOS/NetworkSpeedLogger

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: dist/NetworkSpeedLogger.dmg
          if-no-files-found: error

  publish:
    needs: [release-check, build-macos]
    if: >-
      needs.release-check.outputs.exists != 'true' &&
      needs.build-macos.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-release
          path: artifacts

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(cat <<'EOF'
          Network Speed Logger 0.2.7 macOS pre-release

          - Native Universal macOS application for Apple silicon and Intel Macs
          - Fixed the live chart incorrectly connecting download and upload samples as one line
          - Download and upload now render as independent blue and purple series

          This pre-release contains the macOS DMG only. The latest stable release remains recommended for general use.

          The macOS application is not signed with an Apple Developer ID and is not notarized. Follow the README instructions if Gatekeeper blocks its first launch.
          EOF
          )
          gh release create v0.2.7 \
            artifacts/NetworkSpeedLogger.dmg \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "v0.2.7" \
            --prerelease \
            --notes "$notes"

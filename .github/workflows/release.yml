name: Pre-release v0.4.0

on:
  push:
    branches:
      - main
      - feature/windows-winui3
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION: 0.4.0

jobs:
  release-check:
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.release_check.outputs.exists }}

    steps:
      - name: Check whether v0.4.0 already exists
        id: release_check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.4.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  build-windows:
    needs: release-check
    if: needs.release-check.outputs.exists != 'true'
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build Windows application
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          dotnet publish src\windows\NetworkSpeedLogger.WinUI\NetworkSpeedLogger.WinUI.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:Platform=x64 `
            -p:WindowsAppSDKSelfContained=true `
            -p:Version=$env:APP_VERSION `
            -p:AssemblyVersion=${env:APP_VERSION}.0 `
            -p:FileVersion=${env:APP_VERSION}.0
          if ($LASTEXITCODE -ne 0) {
            throw "dotnet publish failed with exit code $LASTEXITCODE."
          }

          $app = Get-Item src\windows\NetworkSpeedLogger.WinUI\bin\Release\net10.0-windows10.0.17763.0\win-x64\publish\NetworkSpeedLogger.exe
          if (-not $app.VersionInfo.FileVersion.StartsWith($env:APP_VERSION)) {
            throw "Unexpected application file version: $($app.VersionInfo.FileVersion)"
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $command = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          $iscc = if ($null -ne $command) {
            $command.Source
          } else {
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }

          if (-not (Test-Path $iscc)) {
            throw "ISCC.exe was not found."
          }

          & $iscc "/DAppVersion=$env:APP_VERSION" installer\windows\NetworkSpeedLogger.iss
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE."
          }

          $installer = Get-Item dist\NetworkSpeedLogger-Setup.exe
          if ($installer.Length -lt 10MB) {
            throw "The installer is unexpectedly small."
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/NetworkSpeedLogger-Setup.exe
          if-no-files-found: error

  publish:
    needs: [release-check, build-windows]
    if: >-
      github.ref == 'refs/heads/main' &&
      needs.release-check.outputs.exists != 'true' &&
      needs.build-windows.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: artifacts

      - name: Create GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(cat <<'EOF'
          Network Speed Logger 0.4.0 Windows pre-release

          - Rebuilt the Windows client with WinUI 3 and the stable Windows App SDK
          - Added a Windows 11 Fluent visual design with Mica, native controls, light and dark themes, and an integrated title bar
          - Preserved the task-focused layout with session controls on the left and live monitoring cards on the right
          - Preserved automatic physical-adapter detection, multi-adapter aggregation, live interface switching, and manual selection
          - Preserved compatible settings, launch defaults, remembered output folders, CSV logs, and Markdown summaries
          - Replaced the WPF chart and sample grid with native WinUI implementations
          - Ships as a self-contained per-user installer for x64 Windows 10 version 1809 and later

          This pre-release contains the Windows installer only. The application and installer are not code-signed, so Windows SmartScreen may identify the publisher as unknown. The self-contained installer is larger than previous releases because it includes the required .NET and Windows App SDK components.
          EOF
          )
          gh release create v0.4.0 \
            artifacts/NetworkSpeedLogger-Setup.exe \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "v0.4.0" \
            --prerelease \
            --notes "$notes"

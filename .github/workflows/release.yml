name: Release v0.2.1

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-check:
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.release_check.outputs.exists }}

    steps:
      - name: Check whether v0.2.1 already exists
        id: release_check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.2.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  build-windows:
    needs: release-check
    if: needs.release-check.outputs.exists != 'true'
    runs-on: windows-latest

    steps:

      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build GUI application
        shell: pwsh
        run: |
          msbuild src\windows\NetworkSpeedLogger\NetworkSpeedLogger.csproj /restore /m /p:Configuration=Release

      - name: Stage Windows artifact
        shell: pwsh
        run: |
          $asset = Get-ChildItem -Path src\windows\NetworkSpeedLogger\bin\Release -Recurse -Filter NetworkSpeedLogger.exe | Select-Object -First 1
          if ($null -eq $asset) {
            throw "NetworkSpeedLogger.exe was not produced by the build."
          }
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Copy-Item $asset.FullName artifacts\NetworkSpeedLogger.exe

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: artifacts/NetworkSpeedLogger.exe
          if-no-files-found: error

  build-macos:
    needs: release-check
    if: needs.release-check.outputs.exists != 'true'
    runs-on: macos-26

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build Universal macOS application and DMG
        run: bash src/macos/NetworkSpeedLogger/Scripts/build-release.sh 0.2.1

      - name: Verify Universal architectures
        run: lipo -info dist/NetworkSpeedLogger.app/Contents/MacOS/NetworkSpeedLogger

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: dist/NetworkSpeedLogger.dmg
          if-no-files-found: error

  publish:
    needs: [release-check, build-windows, build-macos]
    if: >-
      needs.release-check.outputs.exists != 'true' &&
      needs.build-windows.result == 'success' &&
      needs.build-macos.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: artifacts

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-release
          path: artifacts

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(cat <<'EOF'
          Network Speed Logger 0.2.1

          - Native Universal macOS application for Apple silicon and Intel Macs
          - Standalone Windows GUI application
          - Automatic physical-adapter detection and multi-adapter aggregation
          - Automatic Ethernet/Wi-Fi switching support
          - CSV samples and Markdown session summaries
          - Simplified Chinese and English interfaces
          - Native macOS 26 Liquid Glass sidebar and toolbar appearance
          - Editable duration and sample interval with configurable launch defaults
          - Stricter active-interface detection and complete menu localization

          The macOS application is not signed with an Apple Developer ID and is not notarized. Follow the README instructions if Gatekeeper blocks its first launch.
          EOF
          )
          gh release create v0.2.1 \
            artifacts/NetworkSpeedLogger.exe \
            artifacts/NetworkSpeedLogger.dmg \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Network Speed Logger 0.2.1" \
            --notes "$notes"

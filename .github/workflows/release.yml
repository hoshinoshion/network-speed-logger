name: Pre-release v0.7.5 (macOS)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION: 0.7.5
  APP_BUILD_NUMBER: 27

jobs:
  release-check:
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.release_check.outputs.exists }}

    steps:
      - name: Check whether v0.7.5 already exists
        id: release_check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.7.5 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  build-macos:
    needs: release-check
    if: needs.release-check.outputs.exists != 'true'
    runs-on: macos-26

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build Universal macOS application and DMG
        run: bash src/macos/NetworkSpeedLogger/Scripts/build-release.sh "$APP_VERSION" "$APP_BUILD_NUMBER"

      - name: Verify macOS artifact and icon
        run: |
          lipo dist/NetworkSpeedLogger.app/Contents/MacOS/NetworkSpeedLogger -verify_arch arm64 x86_64
          actual_version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' dist/NetworkSpeedLogger.app/Contents/Info.plist)
          actual_build=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' dist/NetworkSpeedLogger.app/Contents/Info.plist)
          if [[ "$actual_version" != "$APP_VERSION" ]]; then
            echo "Unexpected application version: $actual_version" >&2
            exit 1
          fi
          if [[ "$actual_build" != "$APP_BUILD_NUMBER" ]]; then
            echo "Unexpected application build number: $actual_build" >&2
            exit 1
          fi
          icon_path=dist/NetworkSpeedLogger.app/Contents/Resources/AppIcon.icns
          if [[ ! -s "$icon_path" ]]; then
            echo "The application icon is missing or empty." >&2
            exit 1
          fi
          iconutil -c iconset "$icon_path" -o dist/VerifiedAppIcon.iconset
          if [[ ! -s dist/VerifiedAppIcon.iconset/icon_512x512@2x.png ]]; then
            echo "The 1024-pixel icon representation could not be decoded." >&2
            exit 1
          fi
          if [[ ! -s dist/NetworkSpeedLogger.dmg ]]; then
            echo "The DMG is missing or empty." >&2
            exit 1
          fi

      - name: Smoke-test macOS application startup
        run: |
          app_path="dist/NetworkSpeedLogger.app"
          executable="dist/NetworkSpeedLogger.app/Contents/MacOS/NetworkSpeedLogger"
          log_path="$RUNNER_TEMP/network-speed-logger-startup.log"
          "$executable" >"$log_path" 2>&1 &
          app_pid=$!

          cleanup() {
            if kill -0 "$app_pid" >/dev/null 2>&1; then
              kill -TERM "$app_pid" >/dev/null 2>&1 || true
            fi
            wait "$app_pid" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for _ in {1..5}; do
            sleep 1
            if ! kill -0 "$app_pid" >/dev/null 2>&1; then
              set +e
              wait "$app_pid"
              exit_code=$?
              set -e
              cat "$log_path"
              echo "The macOS application exited during the startup smoke test with code $exit_code." >&2
              exit 1
            fi
          done

          /usr/bin/open "$app_path"
          for _ in {1..3}; do
            sleep 1
            if ! kill -0 "$app_pid" >/dev/null 2>&1; then
              set +e
              wait "$app_pid"
              exit_code=$?
              set -e
              cat "$log_path"
              echo "The macOS application exited after a system reopen request with code $exit_code." >&2
              exit 1
            fi
          done

          cleanup
          trap - EXIT

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: dist/NetworkSpeedLogger.dmg
          if-no-files-found: error

  publish:
    needs: [release-check, build-macos]
    if: >-
      github.ref == 'refs/heads/main' &&
      needs.release-check.outputs.exists != 'true' &&
      needs.build-macos.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-release
          path: artifacts

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(cat <<'EOF'
          Network Speed Logger 0.7.5 macOS pre-release

          - Handles Launchpad and Dock reopen requests at the macOS application lifecycle level
          - Prevents SwiftUI from creating or restoring a second unsynchronized window while menu-bar mode is active
          - Keeps the menu-bar icon, Dock state, and Close or Command-W behavior synchronized across repeated reopen cycles
          - Includes the Universal macOS DMG for Apple silicon and Intel Macs

          This pre-release contains the macOS client only. The application is ad-hoc signed, is not notarized, and may require Open Anyway in System Settings > Privacy & Security on first launch.
          EOF
          )
          gh release create v0.7.5 \
            artifacts/NetworkSpeedLogger.dmg \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "v0.7.5" \
            --prerelease \
            --notes "$notes"

name: Pre-release v0.8.7 (Windows)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION: 0.8.7

jobs:
  release-check:
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.release_check.outputs.exists }}

    steps:
      - name: Check whether v0.8.7 already exists
        id: release_check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.8.7 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  build-windows:
    needs: release-check
    if: needs.release-check.outputs.exists != 'true'
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build Windows application
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          dotnet publish src\windows\NetworkSpeedLogger.WinUI\NetworkSpeedLogger.WinUI.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:Platform=x64 `
            -p:WindowsAppSDKSelfContained=true `
            -p:Version=$env:APP_VERSION `
            -p:AssemblyVersion=${env:APP_VERSION}.0 `
            -p:FileVersion=${env:APP_VERSION}.0
          if ($LASTEXITCODE -ne 0) {
            throw "dotnet publish failed with exit code $LASTEXITCODE."
          }

          $app = Get-Item src\windows\NetworkSpeedLogger.WinUI\bin\x64\Release\net10.0-windows10.0.17763.0\win-x64\publish\NetworkSpeedLogger.exe
          if (-not $app.VersionInfo.FileVersion.StartsWith($env:APP_VERSION)) {
            throw "Unexpected application file version: $($app.VersionInfo.FileVersion)"
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $command = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          $iscc = if ($null -ne $command) {
            $command.Source
          } else {
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }

          if (-not (Test-Path $iscc)) {
            throw "ISCC.exe was not found."
          }

          & $iscc "/DAppVersion=$env:APP_VERSION" installer\windows\NetworkSpeedLogger.iss
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE."
          }

          $installer = Get-Item dist\NetworkSpeedLogger-Setup.exe
          if ($installer.Length -lt 10MB) {
            throw "The installer is unexpectedly small."
          }

      - name: Smoke-test installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = (Resolve-Path dist\NetworkSpeedLogger-Setup.exe).Path
          $installDir = Join-Path $env:RUNNER_TEMP "NetworkSpeedLogger-smoke"

          $installProcess = Start-Process $installer `
            -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/DIR=$installDir") `
            -Wait -PassThru
          if ($installProcess.ExitCode -ne 0) {
            throw "Silent installation failed with exit code $($installProcess.ExitCode)."
          }

          $requiredFiles = @(
            "NetworkSpeedLogger.exe",
            "NetworkSpeedLogger.dll",
            "NetworkSpeedLogger.pri",
            "NetworkSpeedLogger.ico",
            "Microsoft.ui.xaml.dll",
            "Microsoft.WindowsAppRuntime.dll"
          )
          foreach ($file in $requiredFiles) {
            if (-not (Test-Path (Join-Path $installDir $file))) {
              throw "Installed payload is missing $file."
            }
          }

          $app = Get-Item (Join-Path $installDir "NetworkSpeedLogger.exe")
          if (-not $app.VersionInfo.FileVersion.StartsWith($env:APP_VERSION)) {
            throw "Unexpected installed application file version: $($app.VersionInfo.FileVersion)"
          }

          $settingsDir = Join-Path $env:LOCALAPPDATA "NetworkSpeedLogger"
          New-Item -ItemType Directory -Force -Path $settingsDir | Out-Null
          @{
            schemaVersion = 5
            language = "en-US"
            theme = "Auto"
            outputFolder = $env:RUNNER_TEMP
            automaticallyCheckForUpdates = $false
            minimizeToTray = $false
            taskbarSpeed = @{
              enabled = $true
              sampleIntervalSeconds = 1
              speedUnit = "Byte"
              singleLine = $true
              manualMode = $false
              selectedAdapterIds = @()
            }
            defaults = @{
              durationHours = 24
              sampleIntervalSeconds = 15
              speedUnit = "MB/s"
            }
          } | ConvertTo-Json -Depth 4 | Set-Content (Join-Path $settingsDir "settings.json") -Encoding utf8

          $process = Start-Process $app.FullName -PassThru
          Start-Sleep -Seconds 8
          if ($process.HasExited) {
            $crashLog = Join-Path $env:LOCALAPPDATA "NetworkSpeedLogger\crash.log"
            if (Test-Path $crashLog) {
              Write-Host "Application crash log:"
              Get-Content $crashLog
            }
            Write-Host "Recent Windows application events:"
            Get-WinEvent -FilterHashtable @{ LogName = "Application"; StartTime = (Get-Date).AddMinutes(-3) } `
              -ErrorAction SilentlyContinue |
              Where-Object { $_.Message -match "NetworkSpeedLogger" } |
              Select-Object -First 10 TimeCreated, Id, ProviderName, LevelDisplayName, Message |
              Format-List | Out-String | Write-Host
            throw "The installed application exited during the startup smoke test with code $($process.ExitCode)."
          }

          Add-Type @"
          using System;
          using System.Runtime.InteropServices;
          public static class NativeWindowLookup
          {
              [StructLayout(LayoutKind.Sequential)]
              public struct Rect
              {
                  public int Left;
                  public int Top;
                  public int Right;
                  public int Bottom;
              }

              [DllImport("user32.dll", CharSet = CharSet.Unicode)]
              public static extern IntPtr FindWindow(string className, string windowName);

              [DllImport("user32.dll")]
              [return: MarshalAs(UnmanagedType.Bool)]
              public static extern bool GetWindowRect(IntPtr window, out Rect rectangle);

              [DllImport("user32.dll")]
              [return: MarshalAs(UnmanagedType.Bool)]
              public static extern bool IsWindowVisible(IntPtr window);

              [DllImport("user32.dll")]
              [return: MarshalAs(UnmanagedType.Bool)]
              public static extern bool SetForegroundWindow(IntPtr window);

              [DllImport("user32.dll")]
              public static extern IntPtr GetWindow(IntPtr window, uint command);

              [DllImport("user32.dll", CharSet = CharSet.Unicode)]
              public static extern IntPtr CreateWindowEx(
                  uint extendedStyle,
                  string className,
                  string windowName,
                  uint style,
                  int x,
                  int y,
                  int width,
                  int height,
                  IntPtr parent,
                  IntPtr menu,
                  IntPtr instance,
                  IntPtr parameter);

              [DllImport("user32.dll")]
              [return: MarshalAs(UnmanagedType.Bool)]
              public static extern bool ShowWindow(IntPtr window, int command);

              [DllImport("user32.dll")]
              [return: MarshalAs(UnmanagedType.Bool)]
              public static extern bool DestroyWindow(IntPtr window);

          }
          "@
          $overlayWindow = [NativeWindowLookup]::FindWindow("NetworkSpeedLogger.TaskbarSpeed.$($process.Id)", $null)
          if ($overlayWindow -eq [IntPtr]::Zero) {
            throw "The taskbar speed overlay window was not created."
          }
          $singleLineRect = New-Object NativeWindowLookup+Rect
          if (-not [NativeWindowLookup]::GetWindowRect($overlayWindow, [ref]$singleLineRect) -or
              $singleLineRect.Right - $singleLineRect.Left -lt 200) {
            throw "The single-line taskbar speed layout did not use the expected wider overlay."
          }

          $taskbarWindow = [NativeWindowLookup]::FindWindow("Shell_TrayWnd", $null)
          if ($taskbarWindow -eq [IntPtr]::Zero) {
            throw "The primary taskbar window was not found."
          }
          $taskbarRect = New-Object NativeWindowLookup+Rect
          if (-not [NativeWindowLookup]::GetWindowRect($taskbarWindow, [ref]$taskbarRect)) {
            throw "Unable to read the primary taskbar position."
          }
          if ([NativeWindowLookup]::GetWindow($overlayWindow, 4) -ne $taskbarWindow) {
            throw "The taskbar speed overlay is not owned by the primary taskbar window."
          }

          $desktopWindow = [NativeWindowLookup]::FindWindow("Progman", $null)
          if ($desktopWindow -ne [IntPtr]::Zero) {
            $desktopFocused = [NativeWindowLookup]::SetForegroundWindow($desktopWindow)
            if ($desktopFocused) {
              Start-Sleep -Seconds 2
              if (-not [NativeWindowLookup]::IsWindowVisible($overlayWindow)) {
                throw "The overlay disappeared when the desktop received focus."
              }
            }
          }

          if ([NativeWindowLookup]::SetForegroundWindow($taskbarWindow)) {
            Start-Sleep -Seconds 2
            if (-not [NativeWindowLookup]::IsWindowVisible($overlayWindow)) {
              throw "The overlay disappeared when the taskbar received focus."
            }
          }

          $normalWindow = [NativeWindowLookup]::CreateWindowEx(
            0, "STATIC", "Network Speed Logger normal-window smoke test", 0x00CF0000,
            100, 100, 800, 600, [IntPtr]::Zero, [IntPtr]::Zero, [IntPtr]::Zero, [IntPtr]::Zero)
          if ($normalWindow -ne [IntPtr]::Zero) {
            try {
              [NativeWindowLookup]::ShowWindow($normalWindow, 3) | Out-Null
              if ([NativeWindowLookup]::SetForegroundWindow($normalWindow)) {
                Start-Sleep -Seconds 2
                if (-not [NativeWindowLookup]::IsWindowVisible($overlayWindow)) {
                  throw "The overlay disappeared while a maximized ordinary window was active."
                }
              }
            }
            finally {
              [NativeWindowLookup]::DestroyWindow($normalWindow) | Out-Null
            }
          }

          $alignmentPath = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced"
          New-Item -Force -Path $alignmentPath | Out-Null
          $originalProperties = Get-ItemProperty -Path $alignmentPath -ErrorAction SilentlyContinue
          $hadAlignment = $null -ne $originalProperties -and `
            $originalProperties.PSObject.Properties.Name -contains "TaskbarAl"
          $originalAlignment = if ($hadAlignment) { $originalProperties.TaskbarAl } else { $null }

          try {
            New-ItemProperty -Path $alignmentPath -Name TaskbarAl -Value 1 -PropertyType DWord -Force | Out-Null
            Start-Sleep -Seconds 2
            $leftRect = New-Object NativeWindowLookup+Rect
            if (-not [NativeWindowLookup]::GetWindowRect($overlayWindow, [ref]$leftRect) -or
                $leftRect.Left -le $taskbarRect.Left + 100 -or
                $leftRect.Left -ge $taskbarRect.Left + (($taskbarRect.Right - $taskbarRect.Left) / 2)) {
              throw "Centered taskbar mode did not place the overlay after the Widgets area on the left."
            }
            if (-not [NativeWindowLookup]::IsWindowVisible($overlayWindow)) {
              throw "The overlay disappeared while testing centered taskbar mode."
            }

            New-ItemProperty -Path $alignmentPath -Name TaskbarAl -Value 0 -PropertyType DWord -Force | Out-Null
            Start-Sleep -Seconds 2
            $rightRect = New-Object NativeWindowLookup+Rect
            if (-not [NativeWindowLookup]::GetWindowRect($overlayWindow, [ref]$rightRect) -or
                $rightRect.Left -le $taskbarRect.Left + (($taskbarRect.Right - $taskbarRect.Left) / 2)) {
              throw "Left-aligned taskbar mode did not place the overlay on the right."
            }
            if (-not [NativeWindowLookup]::IsWindowVisible($overlayWindow)) {
              throw "The overlay disappeared while testing left-aligned taskbar mode."
            }

            Remove-ItemProperty -Path $alignmentPath -Name TaskbarAl -ErrorAction SilentlyContinue
            if ([Environment]::OSVersion.Version.Build -ge 22000) {
              Start-Sleep -Seconds 2
              $defaultRect = New-Object NativeWindowLookup+Rect
              if (-not [NativeWindowLookup]::GetWindowRect($overlayWindow, [ref]$defaultRect) -or
                  $defaultRect.Left -le $taskbarRect.Left + 100 -or
                  $defaultRect.Left -ge $taskbarRect.Left + (($taskbarRect.Right - $taskbarRect.Left) / 2)) {
                throw "Windows 11's default centered taskbar was not placed after the Widgets area on the left."
              }
              if (-not [NativeWindowLookup]::IsWindowVisible($overlayWindow)) {
                throw "The overlay disappeared while testing Windows 11's default taskbar mode."
              }
            }
          }
          finally {
            if ($hadAlignment) {
              New-ItemProperty -Path $alignmentPath -Name TaskbarAl -Value $originalAlignment -PropertyType DWord -Force | Out-Null
            } else {
              Remove-ItemProperty -Path $alignmentPath -Name TaskbarAl -ErrorAction SilentlyContinue
            }
          }
          Stop-Process -Id $process.Id -Force

          $uninstaller = Join-Path $installDir "unins000.exe"
          $uninstallProcess = Start-Process $uninstaller `
            -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART") `
            -Wait -PassThru
          if ($uninstallProcess.ExitCode -ne 0) {
            throw "Silent uninstall failed with exit code $($uninstallProcess.ExitCode)."
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/NetworkSpeedLogger-Setup.exe
          if-no-files-found: error

  publish:
    needs: [release-check, build-windows]
    if: >-
      github.ref == 'refs/heads/main' &&
      needs.release-check.outputs.exists != 'true' &&
      needs.build-windows.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: artifacts

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(cat <<'EOF'
          Network Speed Logger 0.8.7 Windows pre-release

          - Keeps the taskbar speed display present while opening applications or interacting with Start, notification panels, the tray, and the desktop
          - Anchors the non-interactive overlay to the primary taskbar as an owned window instead of relying on an independent global topmost window
          - Removes foreground-window full-screen guesses that could hide the overlay during ordinary Windows Shell interactions
          - Uses regular-weight single-line typography with a lighter shadow for a cleaner, more refined appearance
          - Preserves layout selection, independent sampling settings, Widgets-area avoidance, and theme adaptation
          - Includes the self-contained Windows x64 installer

          This pre-release contains the Windows client only. The Windows application and installer are not code-signed, so the operating system may identify the publisher as unknown.
          EOF
          )
          gh release create v0.8.7 \
            artifacts/NetworkSpeedLogger-Setup.exe \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "v0.8.7" \
            --prerelease \
            --notes "$notes"
